name: Clean Completed Documentation Patch Workflow

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-dual-runtime-doc-status.yml"

permissions:
  contents: write

concurrency:
  group: clean-dual-runtime-doc-status-workflow
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/sync-dual-runtime-e2e-status"
          fetch-depth: 0

      - name: Remove completed one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dual-runtime-doc-status.yml
          git commit -m "chore(docs): remove completed one-shot workflow"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
