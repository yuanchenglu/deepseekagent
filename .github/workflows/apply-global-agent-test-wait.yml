name: Apply Global Agent Test Wait Patch

on:
  push:
    branches:
      - "chatgpt/dual-runtime-workspace-e2e"
    paths:
      - ".github/workflows/apply-global-agent-test-wait.yml"
      - "scripts/patch-global-agent-test-wait.py"
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-global-agent-test-wait.yml"
      - "scripts/patch-global-agent-test-wait.py"

permissions:
  contents: write

concurrency:
  group: apply-global-agent-test-wait
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/dual-runtime-workspace-e2e"
          fetch-depth: 0

      - name: Apply exact test and workflow patch
        run: python3 scripts/patch-global-agent-test-wait.py

      - name: Remove one-shot patch machinery
        run: git rm scripts/patch-global-agent-test-wait.py .github/workflows/apply-global-agent-test-wait.yml

      - name: Commit deterministic test wait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/tests/server/global-agent-server.test.ts .github/workflows/release-electron-preview.yml
          git commit -m "test(webui): await second MCU audio enqueue deterministically"
          git push origin "HEAD:${GITHUB_REF_NAME}"
