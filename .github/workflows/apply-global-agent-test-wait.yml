name: Apply Global Agent Test Wait Patch

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-global-agent-test-wait.yml"
      - "scripts/patch-global-agent-test-wait.py"

permissions:
  contents: write

concurrency:
  group: apply-global-agent-test-wait-v3
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/dual-runtime-workspace-e2e"
          fetch-depth: 0

      - name: Apply exact test patch
        run: python3 scripts/patch-global-agent-test-wait.py

      - name: Commit deterministic test wait only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/tests/server/global-agent-server.test.ts
          git commit -m "test(webui): await second MCU audio enqueue deterministically"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
