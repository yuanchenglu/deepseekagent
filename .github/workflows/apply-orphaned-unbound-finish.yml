name: Apply Orphaned Unbound Finish Fix

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-orphaned-unbound-finish.yml"
      - "scripts/patch-orphaned-unbound-finish.py"

permissions:
  contents: write

concurrency:
  group: apply-orphaned-unbound-finish
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/dual-runtime-workspace-e2e"
          fetch-depth: 0

      - name: Apply exact Runtime and E2E patch
        run: python3 scripts/patch-orphaned-unbound-finish.py

      - name: Commit Runtime fix only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/packages/desktop/src/main/runtime-task-supervisor.ts webui/tests/server/runtime-task-dual-runtime-e2e.test.ts
          git commit -m "fix(runtime): release unbound orphan after explicit terminal confirmation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
