name: Workspace Lock Wiring Migration

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/pr-workspace-lock-wire.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'chatgpt/workspace-lock-ownership' && github.repository == 'yuanchenglu/deepseekagent' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/workspace-lock-ownership
          fetch-depth: 0

      - name: Replace legacy workspace lock handlers exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('webui/packages/desktop/src/main/index.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { WorkspaceLockManager, type WorkspaceAccess } from './workspace-lock'",
                  "import { registerWorkspaceLockIpc } from './workspace-lock-ipc'",
                  1,
              ),
              (
                  "const workspaceLocks = new WorkspaceLockManager()\n",
                  "",
                  1,
              ),
              (
                  "ipcMain.handle('deepagent:workspace-lock:acquire', (_event, workspace?: unknown, taskId?: unknown, access?: unknown) => (\n"
                  "  typeof workspace === 'string' && typeof taskId === 'string' && (access === 'read' || access === 'write')\n"
                  "    ? workspaceLocks.acquire(workspace, taskId, access as WorkspaceAccess)\n"
                  "    : false\n"
                  "))\n"
                  "ipcMain.handle('deepagent:workspace-lock:release', (_event, workspace?: unknown, taskId?: unknown) => {\n"
                  "  if (typeof workspace === 'string' && typeof taskId === 'string') workspaceLocks.release(workspace, taskId)\n"
                  "})\n"
                  "ipcMain.handle('deepagent:workspace-lock:release-task', (_event, taskId?: unknown) => {\n"
                  "  if (typeof taskId === 'string') workspaceLocks.releaseTask(taskId)\n"
                  "})",
                  "registerWorkspaceLockIpc(ipcMain)",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'index.ts replacement mismatch: expected {expected}, found {count}: {old[:80]!r}')
              text = text.replace(old, new, expected)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Submit index.ts through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: chatgpt/workspace-lock-ownership
        run: |
          set -euo pipefail
          path='webui/packages/desktop/src/main/index.ts'
          if git diff --quiet -- "$path"; then
            echo 'No wiring changes remain.'
            exit 0
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)"
          python3 - "$path" "$sha" "$TARGET_BRANCH" > /tmp/contents-payload.json <<'PY'
          import base64, json, pathlib, sys
          path, sha, branch = sys.argv[1:4]
          json.dump({
              'message': 'fix(electron): wire owner-bound workspace lock IPC',
              'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode('ascii'),
              'sha': sha,
              'branch': branch,
          }, sys.stdout)
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/contents-payload.json >/dev/null
