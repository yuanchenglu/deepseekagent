name: PR6 Changelog Auth Migration

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/pr6-changelog-auth-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'chatgpt/electron-preview-release-gate' && github.repository == 'yuanchenglu/deepseekagent' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/electron-preview-release-gate
          fetch-depth: 0

      - name: Insert changelog.auth within the changelog object
        run: |
          python3 - <<'PY'
          from pathlib import Path

          values = {
              'en.ts': 'Added local seamless login tickets and HttpOnly sessions.',
              'zh.ts': '新增本地无感登录 Ticket 与 HttpOnly Session。',
          }

          for locale, value in values.items():
              path = Path('webui/packages/client/src/i18n/locales') / locale
              text = path.read_text(encoding='utf-8')
              anchor = '  changelog: {\n'
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit(f'{path}: top-level changelog object not found')
              end = text.find('  },', start)
              if end < 0:
                  raise SystemExit(f'{path}: changelog object end not found')
              block = text[start:end]
              if '\n    auth:' in block:
                  print(f'already complete: {path}')
                  continue
              text = text[:start + len(anchor)] + f"    auth: {value!r},\n" + text[start + len(anchor):]
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}')
          PY

      - name: Submit locale updates through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: chatgpt/electron-preview-release-gate
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- \
            webui/packages/client/src/i18n/locales/en.ts \
            webui/packages/client/src/i18n/locales/zh.ts)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changelog auth changes remain."
            exit 0
          fi

          for path in "${files[@]}"; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)"
            python3 - "$path" "$sha" "$TARGET_BRANCH" > /tmp/contents-payload.json <<'PY'
          import base64, json, pathlib, sys
          path, sha, branch = sys.argv[1:4]
          json.dump({
              "message": f"i18n: add authentication changelog copy in {path}",
              "content": base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": branch,
          }, sys.stdout)
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/contents-payload.json >/dev/null
            echo "updated ${path}"
          done
