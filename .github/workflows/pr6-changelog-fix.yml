name: PR6 Changelog Locale Migration

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/pr6-changelog-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'chatgpt/electron-preview-release-gate' && github.repository == 'yuanchenglu/deepseekagent' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/electron-preview-release-gate
          fetch-depth: 0

      - name: Insert missing changelog keys exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          locale_values = {
              'en.ts': {
                  'initial': 'DeepAgent 0.9.0 initial open-source release preparation.',
                  'auth': 'Added local seamless login tickets and HttpOnly sessions.',
                  'electron': 'Added the DeepAgent and DeepCode dual-mode Electron Preview.',
              },
              'zh.ts': {
                  'initial': 'DeepAgent 0.9.0 首个开源版本准备。',
                  'auth': '新增本地无感登录 Ticket 与 HttpOnly Session。',
                  'electron': '新增 DeepAgent 与 DeepCode 双模式 Electron Preview。',
              },
          }

          for locale, values in locale_values.items():
              path = Path('webui/packages/client/src/i18n/locales') / locale
              text = path.read_text(encoding='utf-8')
              missing = [key for key in ('initial', 'auth', 'electron') if f"    {key}:" not in text]
              if not missing:
                  print(f'already complete: {path}')
                  continue

              anchor = '  changelog: {\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one top-level changelog object, found {text.count(anchor)}')

              additions = ''.join(f"    {key}: {values[key]!r},\n" for key in missing)
              text = text.replace(anchor, anchor + additions, 1)
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}: {missing}')
          PY

      - name: Submit locale updates through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: chatgpt/electron-preview-release-gate
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- \
            webui/packages/client/src/i18n/locales/en.ts \
            webui/packages/client/src/i18n/locales/zh.ts)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changelog locale changes remain."
            exit 0
          fi

          for path in "${files[@]}"; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)"
            python3 - "$path" "$sha" "$TARGET_BRANCH" > /tmp/contents-payload.json <<'PY'
          import base64, json, pathlib, sys
          path, sha, branch = sys.argv[1:4]
          json.dump({
              "message": f"i18n: add Electron Preview changelog copy in {path}",
              "content": base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": branch,
          }, sys.stdout)
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/contents-payload.json >/dev/null
            echo "updated ${path}"
          done
