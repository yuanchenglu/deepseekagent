# ============================================================================
# DeepAgent — Release Build & Publish Workflow
# ============================================================================
# 第一阶段发布流水线：构建 MIT Core → GitHub Releases + R2 + Pages。
#
# 触发方式:
#   1. 推送 tag（如 v0.9.0-alpha.1）自动触发
#   2. 手动触发：gh workflow run release.yml -f version=0.9.0
#   3. 手动 dry run：gh workflow run release.yml -f version=0.9.0 -f dry_run=true
#
# Job 依赖链:
#   build-tarball → publish (GitHub + R2) → deploy-pages
#
# 输出物:
#   - deepagent-{version}.tar.gz + .sha256  → GitHub Releases + R2
#   - version manifest + promoted alpha channel
#   - Landing Page + Docs                    → Cloudflare Pages
#
# 所需 Secrets:
#   CF_ACCOUNT_ID           — Cloudflare account ID (用于 R2 endpoint)
#   CF_R2_ACCESS_KEY_ID     — R2 S3 兼容 API access key
#   CF_R2_SECRET_ACCESS_KEY — R2 S3 兼容 API secret key
#   CLOUDFLARE_API_TOKEN    — Cloudflare API token (用于 Pages 部署)
#   GITHUB_TOKEN             — 自动注入，无需手动配置
# ============================================================================

name: Release Build & Publish

on:
  # 触发方式 1：推送版本 tag（如 v0.9.0-alpha.1）
  push:
    tags:
      - 'v*'
  # 触发方式 2：手动触发
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.9.0-alpha.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, no upload to GitHub Releases or R2)'
        required: false
        default: false
        type: boolean

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  contents: write    # 允许 gh release create

# ============================================================================
# Jobs
# ============================================================================
jobs:

  # --------------------------------------------------------------------------
  # Job 1: Build Release Tarball (+ Smoke Test)
  # --------------------------------------------------------------------------
  build-tarball:
    name: Build Release Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go for secret scanning
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Scan all Git history for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json \
            .

      - name: Upload redacted secret scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Determine release version
        id: version
        run: |
          # 如果是 workflow_dispatch，使用 inputs.version
          # 如果是 push tag，从 tag 名提取版本号（去掉 v 前缀）
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # GITHUB_REF 格式: refs/tags/v0.9.0-alpha.1
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Write VERSION file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]] || [[ "$VERSION" == *..* ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF" = "refs/tags/v${VERSION}" ] || exit 1
          elif [ "${{ inputs.dry_run }}" != "true" ]; then
            TAG_COMMIT="$(git rev-list -n 1 "v${VERSION}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] || {
              echo "Publishing requires tag v${VERSION} to point at HEAD" >&2
              exit 1
            }
          fi
          printf '%s\n' "$VERSION" > VERSION

      - name: Build tarball (pre-release mode — skip pre-built checks)
        run: |
          chmod +x scripts/build-release.sh
          bash scripts/build-release.sh \
            --core-only \
            --version "${{ steps.version.outputs.version }}"

      - name: List build artifacts
        run: ls -lh dist/releases/

      - name: Verify Core-only artifact boundary
        run: |
          TARBALL="dist/releases/deepagent-${{ steps.version.outputs.version }}.tar.gz"
          if tar -tzf "$TARBALL" | grep -Eq '^(webui|embedded/opencode)(/|$)'; then
            echo "Core artifact contains Phase 2/3 files" >&2
            exit 1
          fi

      # ─── Smoke Test：验证 tarball 在实际环境中可用 ───────────────────────
      # 解压 tarball → 安装 uv → uv sync --no-dev → deepagent --version
      - name: Smoke test — verify tarball is installable
        run: |
          echo "=== Smoke Test: Extract → uv sync → deepagent --version ==="
          TARBALL="dist/releases/deepagent-${{ steps.version.outputs.version }}.tar.gz"
          SMOKE_DIR="/tmp/smoke-test"

          mkdir -p "$SMOKE_DIR"
          tar -xzf "$TARBALL" -C "$SMOKE_DIR"

          # 安装 uv
          curl -fsSL https://astral.sh/uv/0.6.12/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          # 在解压目录中创建 venv 并安装依赖
          cd "$SMOKE_DIR"
          uv venv --python 3.12
          uv sync --no-dev

          # 验证 deepagent --version 可执行
          echo "=== Running: deepagent --version ==="
          .venv/bin/deepagent --version
          .venv/bin/python scripts/audit-python-licenses.py \
            --output "$GITHUB_WORKSPACE/dist/releases/deepagent-python-licenses-${{ steps.version.outputs.version }}.json"

          echo "=== Smoke Test PASSED ==="

      - name: Upload tarball & checksum as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/releases/*

  # --------------------------------------------------------------------------
  # Job 2: Build Desktop DMG (macOS ARM64 + x64, parallel matrix)
  # --------------------------------------------------------------------------
  build-dmg:
    name: Build Desktop DMG (${{ matrix.arch }})
    # Phase 1 publishes CLI Core only. Re-enable from the dedicated Desktop
    # preview workflow after Phase 3 signing/notarization gates exist.
    if: ${{ false }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install npm dependencies
        working-directory: webui
        run: npm install --ignore-scripts

      - name: Build WebUI (client + server)
        working-directory: webui
        run: npm run build

      - name: Build DMG with electron-builder
        working-directory: webui
        run: |
          npx electron-builder \
            --config electron/electron-builder.config.js \
            --mac \
            --${{ matrix.arch }}

      - name: List DMG artifacts
        run: ls -lh webui/dist/electron-output/

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: webui/dist/electron-output/*

  # --------------------------------------------------------------------------
  # Job 3: Publish to GitHub Releases & Cloudflare R2
  # --------------------------------------------------------------------------
  publish:
    name: Publish to GitHub Releases & R2
    needs: [build-tarball]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for changelog / release notes

      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: |
          echo "=== release-tarball ==="
          ls -lh release-tarball/

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --draft \
            --title "DeepAgent v${{ steps.version.outputs.version }}" \
            --notes "See [CHANGELOG](docs/releases/CHANGELOG.md) for details." \
            release-tarball/*

      - name: Upload assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ENDPOINT_URL="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="deepagent-releases"

          VERSION="${{ steps.version.outputs.version }}"
          echo "Uploading immutable Core artifact and checksum to R2..."
          for f in "release-tarball/deepagent-${VERSION}.tar.gz" \
                   "release-tarball/deepagent-${VERSION}.tar.gz.sha256"; do
            echo "  uploading: ${f##*/}"
            aws s3 cp "$f" "s3://${BUCKET}/${f##*/}" \
              --endpoint-url "$ENDPOINT_URL" \
              --region auto
          done

          aws s3 cp "release-tarball/deepagent-manifest-${VERSION}.json" \
            "s3://${BUCKET}/manifests/${VERSION}.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          aws s3 cp "release-tarball/deepagent-python-licenses-${VERSION}.json" \
            "s3://${BUCKET}/licenses/${VERSION}.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto

          echo "Reading immutable objects back from R2..."
          aws s3 cp "s3://${BUCKET}/deepagent-${VERSION}.tar.gz" \
            "/tmp/deepagent-${VERSION}.tar.gz" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          aws s3 cp "s3://${BUCKET}/manifests/${VERSION}.json" \
            "/tmp/deepagent-manifest-${VERSION}.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          aws s3 cp "s3://${BUCKET}/licenses/${VERSION}.json" \
            "/tmp/deepagent-python-licenses-${VERSION}.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          (cd /tmp && sha256sum -c \
            "$GITHUB_WORKSPACE/release-tarball/deepagent-${VERSION}.tar.gz.sha256")
          cmp "release-tarball/deepagent-manifest-${VERSION}.json" \
            "/tmp/deepagent-manifest-${VERSION}.json"
          cmp "release-tarball/deepagent-python-licenses-${VERSION}.json" \
            "/tmp/deepagent-python-licenses-${VERSION}.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release edit "v${VERSION}" --draft=false
          [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft)" = "false" ]

      - name: Promote verified Alpha channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ENDPOINT_URL="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="deepagent-releases"
          # Promotion is last: users cannot see this version until GitHub and
          # all immutable R2 objects have passed verification.
          aws s3 cp "release-tarball/deepagent-channel-alpha.json" \
            "s3://${BUCKET}/channels/alpha.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          aws s3 cp "s3://${BUCKET}/channels/alpha.json" \
            "/tmp/deepagent-channel-alpha.json" \
            --endpoint-url "$ENDPOINT_URL" --region auto
          cmp release-tarball/deepagent-channel-alpha.json \
            /tmp/deepagent-channel-alpha.json

  # --------------------------------------------------------------------------
  # Job 4: Deploy Landing Page + Docs to Cloudflare Pages
  # --------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: [publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build website (landing page + docs)
        run: bash scripts/build-website.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd website
          npx wrangler pages deploy build \
            --project-name=deepagent-website \
            --branch=main

      - name: Verify deployment
        run: |
          echo "=== Verifying Pages deployment ==="
          sleep 5
          # 获取最新部署 URL
          PAGES_URL=$(npx wrangler pages deployment list \
            --project-name=deepagent-website 2>/dev/null | \
            grep -oE 'https://[a-f0-9]+\.deepagent-website\.pages\.dev' | head -1)

          if [ -z "$PAGES_URL" ]; then
            echo "Could not determine Pages URL" >&2
            exit 1
          fi
          echo "Pages URL: $PAGES_URL"
          curl -fsSI "$PAGES_URL/" | head -1
          curl -fsSL "$PAGES_URL/install.sh" -o /tmp/deepagent-install.sh
          head -1 /tmp/deepagent-install.sh | grep -q '^#!/usr/bin/env bash$'
          bash -n /tmp/deepagent-install.sh

          # The official domain is the public contract, not only pages.dev.
          curl -fsSL https://deepseekagent.starseas.org/install.sh \
            -o /tmp/deepagent-install-official.sh
          head -1 /tmp/deepagent-install-official.sh | grep -q '^#!/usr/bin/env bash$'
          bash -n /tmp/deepagent-install-official.sh
          echo "=== Pages deployment complete ==="
