name: WebUI Browser E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  push:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Chromium authentication and navigation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    defaults:
      run:
        working-directory: webui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-e2e-${{ github.run_attempt }}
          path: |
            webui/playwright-report/
            webui/test-results/
          if-no-files-found: ignore
          retention-days: 14
