name: WebUI Browser E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webui-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-main-diagnostic:
    name: Capture Electron Main diagnostics
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-15-arm64
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Run Electron Main installation and tests
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          cd webui
          npm ci --no-audit --no-fund > ../scripts/electron-main-full.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run desktop:install >> ../scripts/electron-main-full.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npx vitest run --config packages/desktop/vitest.config.ts >> ../scripts/electron-main-full.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm --prefix packages/desktop run build:main >> ../scripts/electron-main-full.log 2>&1
            status=$?
          fi
          cd ..
          if [ "$status" -eq 0 ]; then
            rm -f scripts/electron-main-full.log
            exit 0
          fi
          tail -n 350 scripts/electron-main-full.log \
            | sed -E 's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1[redacted]@#g; s/(_authToken=)[^[:space:]]+/\1[redacted]/g' \
            > scripts/electron-main-diagnostic.log
          rm -f scripts/electron-main-full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/electron-main-diagnostic.log
          git commit -m "chore(ci): capture Electron Main failure diagnostics"
          git push origin "HEAD:${HEAD_REF}"
          cat scripts/electron-main-diagnostic.log >&2
          exit "$status"
