name: WebUI Browser E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webui-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-ci-diagnostic:
    name: Capture npm ci diagnostics
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Capture dependency installation failure
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          cd webui
          npm ci --no-audit --no-fund > ../scripts/npm-ci-full.log 2>&1
          status=$?
          cd ..
          if [ "$status" -eq 0 ]; then
            rm -f scripts/npm-ci-full.log
            exit 0
          fi
          tail -n 250 scripts/npm-ci-full.log \
            | sed -E 's#(https?://)[^/@[:space:]]+:[^/@[:space:]]+@#\1[redacted]@#g; s/(_authToken=)[^[:space:]]+/\1[redacted]/g' \
            > scripts/npm-ci-diagnostic.log
          rm -f scripts/npm-ci-full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/npm-ci-diagnostic.log
          git commit -m "chore(ci): capture npm ci failure diagnostics"
          git push origin "HEAD:${HEAD_REF}"
          cat scripts/npm-ci-diagnostic.log >&2
          exit "$status"
