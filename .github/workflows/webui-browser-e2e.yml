name: WebUI Browser E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - "webui/**"
      - "hermes_cli/webui.py"
      - "scripts/apply-runtime-task-pid-lifecycle.patch"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  push:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webui-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-runtime-task-patch:
    name: Apply Runtime task PID lifecycle patch
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate and apply atomic patch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          PATCH="scripts/apply-runtime-task-pid-lifecycle.patch"
          NORMALIZED="$(mktemp)"
          python3 - "$PATCH" "$NORMALIZED" <<'PY'
          from pathlib import Path
          import sys

          source, target = map(Path, sys.argv[1:])
          normalized = []
          in_hunk = False
          for line in source.read_text(encoding='utf-8').splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
              if line.startswith('@@ '):
                  in_hunk = True
              if in_hunk and line == '':
                  line = ' '
              normalized.append(line)
          target.write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          if ! git apply --recount --verbose --check "$NORMALIZED" 2> scripts/runtime-task-patch-error.log; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f scripts/runtime-task-patch-error.log
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): capture Runtime PID patch failure"
              git push origin "HEAD:${HEAD_REF}"
            fi
            cat scripts/runtime-task-patch-error.log >&2
            exit 1
          fi
          git apply --recount "$NORMALIZED"
          git checkout origin/develop -- .github/workflows/webui-browser-e2e.yml
          git rm "$PATCH"
          git rm -f scripts/runtime-task-patch-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A webui hermes_cli/webui.py .github/workflows/webui-browser-e2e.yml scripts
          git commit -m "feat(runtime): connect real task and PID lifecycles"

      - name: Push finalized branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:${HEAD_REF}"

  browser-e2e:
    name: Chromium authentication and navigation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    defaults:
      run:
        working-directory: webui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-e2e-${{ github.run_attempt }}
          path: |
            webui/playwright-report/
            webui/test-results/
          if-no-files-found: ignore
          retention-days: 14
