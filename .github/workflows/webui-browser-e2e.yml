name: WebUI Browser E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - "webui/**"
      - "hermes_cli/webui.py"
      - "scripts/apply-runtime-*"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  push:
    branches: [develop]
    paths:
      - "webui/**"
      - ".github/workflows/webui-browser-e2e.yml"
      - ".github/workflows/release-electron-preview.yml"
      - "scripts/check-electron-preview-concurrency.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webui-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-runtime-task-patch:
    name: Apply Runtime task PID lifecycle patch
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate and apply atomic transformations
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          if ! {
            python3 scripts/apply-runtime-main.py
            python3 scripts/apply-runtime-deepagent.py
            python3 - <<'PY'
            from pathlib import Path

            target = Path('scripts/apply-runtime-deepcode.py')
            lines = target.read_text(encoding='utf-8').splitlines()
            starts = [index for index, line in enumerate(lines) if line == 'replace_once(path, """    })']
            if len(starts) != 2:
                raise RuntimeError(f'expected exactly two DeepCode spawn transform calls, found {len(starts)}')

            def call_end(start: int) -> int:
                delimiters = 0
                for index in range(start, len(lines)):
                    delimiters += lines[index].count('"""')
                    if delimiters >= 4:
                        return index
                raise RuntimeError('unterminated DeepCode spawn transform call')

            first_start, second_start = starts
            first_end = call_end(first_start)
            second_end = call_end(second_start)
            del lines[second_start:second_end + 1]
            lines[first_start] = lines[first_start].replace('replace_once(', 'replace_exact(', 1)
            lines[first_end] = lines[first_end].replace('""")', '""", 2)', 1)

            insertion = next(index for index, line in enumerate(lines) if line.startswith('path = '))
            helper = [
                '',
                'def replace_exact(path: str, old: str, new: str, expected: int) -> None:',
                '    target = Path(path)',
                '    text = target.read_text(encoding="utf-8")',
                '    count = text.count(old)',
                '    if count != expected:',
                '        raise RuntimeError(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")',
                '    target.write_text(text.replace(old, new), encoding="utf-8")',
                '',
            ]
            lines[insertion:insertion] = helper
            target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
            PY
            python3 scripts/apply-runtime-deepcode.py
          } >"$LOG" 2>&1; then
            git reset --hard HEAD
            cp "$LOG" scripts/runtime-task-transform-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f scripts/runtime-task-transform-error.log
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): capture Runtime lifecycle transform failure"
              git push origin "HEAD:${HEAD_REF}"
            fi
            cat "$LOG" >&2
            exit 1
          fi
          cat "$LOG"
          git checkout origin/develop -- .github/workflows/webui-browser-e2e.yml
          git rm -f \
            scripts/apply-runtime-task-pid-lifecycle.patch \
            scripts/apply-runtime-main.py \
            scripts/apply-runtime-deepagent.py \
            scripts/apply-runtime-deepcode.py \
            scripts/runtime-task-patch-error.log \
            scripts/runtime-task-transform-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A webui hermes_cli/webui.py .github/workflows/webui-browser-e2e.yml scripts
          git commit -m "feat(runtime): connect real task and PID lifecycles"

      - name: Push finalized branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:${HEAD_REF}"

  browser-e2e:
    name: Chromium authentication and navigation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    defaults:
      run:
        working-directory: webui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-e2e-${{ github.run_attempt }}
          path: |
            webui/playwright-report/
            webui/test-results/
          if-no-files-found: ignore
          retention-days: 14
