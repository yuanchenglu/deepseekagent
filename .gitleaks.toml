title = "DeepSeekAgent Gitleaks configuration"

[extend]
useDefault = true

# These allowlists are intentionally rule-specific and path-specific.
# They cover audited public OAuth client IDs, fake test credentials,
# redaction-pattern fixtures, and documentation examples already present in
# the imported upstream history. New findings in any other file still fail CI.

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Audited public identifiers, fake credentials, fixtures, and upstream reference documents"
  paths = [
    '''^agent/anthropic_adapter\.py$''',
    '''^hermes_cli/auth\.py$''',
    '''^hermes_cli/copilot_auth\.py$''',
    '''^openspec/src/core/templates/workflows/feedback\.ts$''',
    '''^openspec/src/telemetry/index\.ts$''',
    '''^optional-skills/productivity/telephony/scripts/telephony\.py$''',
    '''^skills/ai-ml/volcengine-ark-integration/references/session-verified-config\.md$''',
    '''^skills/mlops/training/unsloth/references/llms-full\.md$''',
    '''^skills/mlops/training/unsloth/references/llms-txt\.md$''',
    '''^tests/agent/test_redact\.py$''',
    '''^tests/gateway/test_agent_cache\.py$''',
    '''^tests/gateway/test_weixin\.py$''',
    '''^tests/hermes_cli/test_arcee_provider\.py$''',
    '''^tests/hermes_cli/test_auth_commands\.py$''',
    '''^tests/hermes_cli/test_config\.py$''',
    '''^tests/hermes_cli/test_non_ascii_credential\.py$''',
    '''^tests/hermes_cli/test_ollama_cloud_auth\.py$''',
    '''^tests/hermes_cli/test_status\.py$''',
    '''^tests/hermes_cli/test_xiaomi_provider\.py$''',
    '''^tests/run_agent/test_413_compression\.py$''',
    '''^tests/run_agent/test_context_pressure\.py$''',
    '''^tests/run_agent/test_invalid_context_length_warning\.py$''',
    '''^tests/run_agent/test_plugin_context_engine_init\.py$''',
    '''^tests/run_agent/test_primary_runtime_restore\.py$''',
    '''^tests/run_agent/test_run_agent\.py$''',
    '''^tests/skills/test_google_workspace_api\.py$''',
    '''^tests/test_honcho_client_config\.py$''',
    '''^tests/tools/test_homeassistant_tool\.py$''',
    '''^tests/tools/test_mcp_tool\.py$''',
    '''^website/docs/user-guide/messaging/wecom-callback\.md$''',
    '''^webui/packages/server/src/controllers/hermes/xai-auth\.ts$''',
    '''^webui/packages/server/src/services/hermes/copilot-device-flow\.ts$''',
    '''^webui/tests/client/voice-dialogue-controls\.test\.ts$'''
  ]

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Documentation-only curl authentication examples"
  paths = [
    '''^skills/devops/new-api-daily-ops/SKILL\.md$''',
    '''^skills/devops/new-api-daily-ops/references/token-validity-check\.md$''',
    '''^website/docs/user-guide/features/api-server\.md$''',
    '''^website/docs/user-guide/messaging/matrix\.md$''',
    '''^website/docs/user-guide/messaging/mattermost\.md$'''
  ]

[[rules]]
id = "discord-client-id"

  [[rules.allowlists]]
  description = "Public Discord application ID examples in documentation"
  paths = [
    '''^website/docs/guides/tips\.md$''',
    '''^website/docs/user-guide/features/voice-mode\.md$''',
    '''^website/docs/user-guide/messaging/discord\.md$''',
    '''^website/docs/user-guide/messaging/index\.md$''',
    '''^website/docs/user-guide/security\.md$'''
  ]

[[rules]]
id = "mattermost-access-token"

  [[rules.allowlists]]
  description = "Mattermost token placeholders in documentation"
  paths = [
    '''^website/docs/user-guide/messaging/index\.md$''',
    '''^website/docs/user-guide/messaging/mattermost\.md$'''
  ]

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Static non-production JWT used only by Playwright mock fixtures"
  paths = [
    '''^webui/tests/e2e/fixtures\.ts$'''
  ]

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Private-key detection regex fixture in the redaction implementation"
  paths = [
    '''^agent/redact\.py$'''
  ]
