<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SITE_TITLE}}</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .sidebar-nav li { font-size: 13px; }
    .sidebar-nav > ul > li > a { font-weight: 600; }
    .markdown-section { max-width: 900px; }
    .search input { border-radius: 20px !important; padding: 8px 16px !important; }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '{{SITE_TITLE}}',
      repo: '',
      // ⚠️ MUST be absolute path — relative paths break when basePath is set
      loadSidebar: '/_sidebar.md',
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/docs/',
      relativePath: true,
      maxLevel: 4,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索...',
        noData: '😢 没有找到相关文章',
        depth: 4,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: '📋 复制',
        errorText: '❌ 复制失败',
        successText: '✅ 已复制'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
