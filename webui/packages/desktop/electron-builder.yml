appId: org.starseas.deepagent
productName: DeepAgent
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

publish:
  provider: generic
  url: https://deepseekagent.starseas.org/releases/desktop

# Don't auto-prune our root node_modules; we curate `files` and `extraResources` ourselves.
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false

files:
  - "dist/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,LICENSE,LICENSE.txt,license,*.d.ts}"
  - "!**/node_modules/.bin"
  - "!**/{.DS_Store,.git,.gitignore,.eslintrc*,.prettierrc*,*.map,tsconfig.json}"

# Electron Preview is a shell over the Phase 2 managed Runtime. It does not
# bundle another Agent/WebUI/OpenCode implementation.
extraResources:
  - from: "build"
    to: "build"
    filter:
      - "icon.png"
      - "trayTemplate.png"

asarUnpack:
  - "**/*.node"

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # Preview builds are intentionally unsigned until an Apple Developer account
  # is available. Explicitly disable identity discovery so local certificates
  # cannot make otherwise identical builds differ.
  identity: null
  artifactName: "DeepAgent-${version}-${arch}.${ext}"

dmg:
  title: "DeepAgent ${version}"
  contents:
    - x: 140
      y: 200
    - x: 420
      y: 200
      type: link
      path: /Applications
